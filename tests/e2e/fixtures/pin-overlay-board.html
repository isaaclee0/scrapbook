<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pin overlay board fixture</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    .spacer { height: 1400px; }
    #pinOverlay[hidden] { display: none; }
    #pinOverlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .3); }
    #pinOverlayPanel { margin: 5vh auto; width: min(90vw, 900px); height: 80vh; background: white; }
    #pinOverlayFrame { width: 100%; height: 100%; }
    [data-overlay-state] { display: none; }
    #pinOverlay[data-state="loading"] [data-overlay-state="loading"],
    #pinOverlay[data-state="error"] [data-overlay-state="error"] { display: block; }
  </style>
</head>
<body>
  <main id="boardPageContent" tabindex="-1">
    <div class="spacer"></div>
    <article id="pin-42" class="pin-card"><a id="pin-42-link" href="/pin/42">Open pin 42</a></article>
  </main>
  <section id="pinOverlay" hidden aria-hidden="true" aria-modal="true" role="dialog" data-state="idle">
    <div id="pinOverlayPanel">
      <button type="button" data-overlay-close>Close</button>
      <a data-overlay-open-page>Open as Page</a>
      <div data-overlay-state="loading">Loading</div>
      <div data-overlay-state="error">Could not load <button type="button" data-overlay-retry>Retry</button></div>
      <iframe id="pinOverlayFrame" title="Pin details"></iframe>
    </div>
  </section>
  <script src="../../../static/js/pin-overlay.js"></script>
  <script>
    window.refreshCalls = [];
    window.toastCalls = [];
    window.overlayController = window.createPinOverlayController({
      boardId: 9,
      root: document.getElementById('pinOverlay'),
      boardContent: document.getElementById('boardPageContent'),
      refreshPinCard: async (pinId, change) => {
        window.refreshCalls.push({ pinId, change });
        if (new URL(window.location.href).searchParams.has('refreshFails')) {
          throw new Error('fixture refresh failure');
        }
        const replacement = document.createElement('article');
        replacement.id = 'pin-' + pinId;
        replacement.className = 'pin-card';
        replacement.tabIndex = -1;
        replacement.textContent = 'Refreshed pin ' + pinId;
        document.getElementById('pin-' + pinId).replaceWith(replacement);
        return replacement;
      },
      showToast: message => window.toastCalls.push(message),
      readyTimeoutMs: 250
    });
    window.overlayController.syncFromLocation();
  </script>
</body>
</html>
