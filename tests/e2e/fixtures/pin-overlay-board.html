<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pin overlay board fixture</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    .spacer { height: 1400px; }
    .section-circle.active { font-weight: 700; }
    #pinOverlay[hidden] { display: none; }
    #pinOverlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .3); }
    #pinOverlayPanel { margin: 5vh auto; width: min(90vw, 900px); height: 80vh; background: white; }
    #pinOverlayFrame { width: 100%; height: 100%; }
    [data-overlay-state] { display: none; }
    #pinOverlay[data-state="loading"] [data-overlay-state="loading"],
    #pinOverlay[data-state="error"] [data-overlay-state="error"] { display: block; }
  </style>
</head>
<body>
  <main id="boardPageContent" tabindex="-1">
    <nav aria-label="Board sections">
      <button type="button" class="section-circle active" data-section-id="all">All</button>
      <button type="button" class="section-circle" data-section-id="7">Section 7</button>
    </nav>
    <div id="pinsGrid">
      <article id="pin-42" class="pin-card" data-pin-id="42" data-section-id="7">
        <a id="pin-42-link" href="/pin/42">Open pin 42</a>
      </article>
    </div>
    <div class="spacer"></div>
  </main>
  <section id="pinOverlay" hidden aria-hidden="true" aria-modal="true" role="dialog" data-state="idle">
    <div id="pinOverlayPanel">
      <button type="button" data-overlay-close>Close</button>
      <a data-overlay-open-page>Open as Page</a>
      <div data-overlay-state="loading">Loading</div>
      <div data-overlay-state="error">Could not load <button type="button" data-overlay-retry>Retry</button></div>
      <iframe id="pinOverlayFrame" title="Pin details"></iframe>
    </div>
  </section>
  <script src="../../../static/js/pin-overlay.js"></script>
  <script>
    window.refreshCalls = [];
    window.layoutCalls = [];
    window.toastCalls = [];
    window.activeSectionFilter = 'all';
    window.scrapbookMasonry = {
      layout: () => window.layoutCalls.push('layout')
    };
    document.querySelectorAll('.section-circle').forEach(circle => {
      circle.addEventListener('click', () => {
        document.querySelectorAll('.section-circle').forEach(item => item.classList.remove('active'));
        circle.classList.add('active');
        window.activeSectionFilter = circle.dataset.sectionId;
      });
    });
    function createBoardPinCard(pin) {
      const card = document.createElement('article');
      card.id = `pin-${pin.id}`;
      card.className = 'pin-card';
      card.dataset.pinId = String(pin.id);
      card.dataset.sectionId = pin.section_id == null ? '' : String(pin.section_id);
      card.tabIndex = -1;
      card.textContent = pin.title;
      return card;
    }
    function applyCurrentSectionFilter() {
      document.querySelectorAll('.pin-card').forEach(card => {
        card.style.display = window.activeSectionFilter === 'all' ||
          card.dataset.sectionId === window.activeSectionFilter ? '' : 'none';
      });
      window.scrapbookMasonry.layout();
    }
    async function refreshBoardPinCard(pinId, change) {
      const existingCard = document.getElementById(`pin-${pinId}`);
      if (change === 'deleted') {
        if (existingCard) {
          existingCard.remove();
          applyCurrentSectionFilter();
        }
        return null;
      }
      const response = await fetch(`/api/pin/${pinId}/card`);
      if (!response.ok) throw new Error('fixture card refresh failed');
      const data = await response.json();
      const currentCard = document.getElementById(`pin-${pinId}`);
      if (!currentCard) return null;
      if (Number(data.pin.board_id) !== 9) {
        currentCard.remove();
        applyCurrentSectionFilter();
        return null;
      }
      const replacement = createBoardPinCard(data.pin);
      currentCard.replaceWith(replacement);
      applyCurrentSectionFilter();
      return replacement;
    }
    window.overlayController = window.createPinOverlayController({
      boardId: 9,
      root: document.getElementById('pinOverlay'),
      boardContent: document.getElementById('boardPageContent'),
      refreshPinCard: async (pinId, change) => {
        window.refreshCalls.push({ pinId, change });
        if (new URL(window.location.href).searchParams.has('refreshFails')) {
          throw new Error('fixture refresh failure');
        }
        return refreshBoardPinCard(pinId, change);
      },
      showToast: message => window.toastCalls.push(message),
      readyTimeoutMs: 250
    });
    window.overlayController.syncFromLocation();
  </script>
</body>
</html>
