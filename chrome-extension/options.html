<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Send to Scrappl — Settings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 420px; margin: 40px auto; color: #222; }
    h1 { font-size: 18px; } label { display: block; margin: 16px 0 4px; font-size: 13px; font-weight: 600; }
    input { width: 100%; padding: 8px; border: 2px solid #e1e5e9; border-radius: 8px; font-size: 13px; box-sizing: border-box; }
    button { margin-top: 12px; margin-right: 8px; padding: 8px 16px; border: none; border-radius: 4px; background: #2980b9; color: white; cursor: pointer; font-size: 13px; }
    .secondary { background: #64748b; } #status { margin-top: 12px; font-size: 13px; color: #16a34a; min-height: 16px; } .hint { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h1>Send to Scrappl</h1>
  <p class="hint">Ready to use with Scrappl.com. Set an override only for local or staging development.</p>
  <label for="baseUrl">Scrappl URL for development</label>
  <input id="baseUrl" type="url" placeholder="http://localhost:8000">
  <button id="save">Save</button><button id="reset" class="secondary">Use Scrappl.com</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
